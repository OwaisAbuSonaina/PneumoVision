[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Owais Abu Sonaina", email = "owaisabusonaina@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "python-multipart>=0.0.32",
    "tensorflow>=2.21.0",
    "tf-keras>=2.21.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
