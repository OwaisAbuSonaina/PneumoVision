services:
  backend:
    container_name: PneumoVision_backend
    build: ./backend
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - model_cache:/app/models
    env_file:
      - .env
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    container_name: PneumoVision_frontend
    build: ./frontend
    ports:
      - "7860:7860"
    environment:
      - BACKEND_HOST=backend
    depends_on:
      - backend
    restart: always

volumes:
  model_cache:
